name: Monthly audit

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      judges:
        description: "Override judge list (comma-separated provider:model)"
        required: false

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'mohammadi-hadi/judgewatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Decide whether to run
        id: plan
        env:
          JUDGES: ${{ inputs.judges }}
        run: |
          if [ -n "$JUDGES" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            ENABLED=$(python -c "import yaml; print(sum(1 for j in (yaml.safe_load(open('judges.yaml')) or {}).get('judges', []) if j.get('enabled')))")
            if [ "$ENABLED" -gt 0 ]; then
              echo "go=1" >> "$GITHUB_OUTPUT"
            else
              echo "go=0" >> "$GITHUB_OUTPUT"
              echo "No judges enabled and no override given - nothing to audit."
            fi
          fi
      - name: Run audit
        if: steps.plan.outputs.go == '1'
        env:
          JUDGES: ${{ inputs.judges }}
        run: |
          MONTH=$(date -u +%Y-%m)
          if [ -n "$JUDGES" ]; then
            python -m judgewatch run --month "$MONTH" --judges "$JUDGES"
          else
            python -m judgewatch run --month "$MONTH"
          fi
          python -m judgewatch report
          python -m judgewatch site
      - name: Commit results
        if: steps.plan.outputs.go == '1'
        run: |
          git config user.name "Hadi Mohammadi"
          git config user.email "50410241+mohammadi-hadi@users.noreply.github.com"
          git add data docs
          git commit -m "Monthly audit for $(date -u +%Y-%m)" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
