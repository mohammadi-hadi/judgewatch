[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgewatch"
version = "0.1.0"
description = "Monthly bias audits of LLM judges, published as a public leaderboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hadi Mohammadi" }]
keywords = ["llm", "llm-as-judge", "evaluation", "bias", "benchmark"]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
judgewatch = "judgewatch.__main__:main"

[project.urls]
Repository = "https://github.com/mohammadi-hadi/judgewatch"
Leaderboard = "https://mohammadi.cv/judgewatch/"

[tool.hatch.build.targets.wheel]
packages = ["judgewatch"]

[tool.ruff]
target-version = "py310"
